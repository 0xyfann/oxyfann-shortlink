
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OXYFANN Shortlink</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #080d18;
      color: white;
      font-family: Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      background: #111b2d;
      border: 1px solid #263958;
      border-radius: 18px;
      text-align: center;
    }
    h1 { color: #54e5ff; }
    p { color: #b7c5d9; line-height: 1.6; }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 15px;
    }
    input {
      border: 1px solid #344766;
      background: #080d18;
      color: white;
    }
    button {
      border: 0;
      background: #54e5ff;
      color: #08111e;
      font-weight: bold;
    }
    #hasil {
      overflow-wrap: anywhere;
      margin-top: 18px;
    }
    small { color: #8294ad; }
  </style>
</head>
<body>
  <main class="card">
    <h1>OXYFANN</h1>
    <p>SHORTLINK GENERATOR</p>
    <p>Masukkan URL lengkap untuk membuat kode link.</p>

    <input id="url" type="url"
      placeholder="https://contoh.com"
      autocomplete="url">

    <button onclick="buatLink()">Buat Link</button>

    <div id="hasil"></div>

    <p><small>
      Demo awal. Link yang dibuat belum menjadi
      shortlink publik dan belum menghasilkan uang.
    </small></p>
  </main>

  <script>
    function buatLink() {
      const input = document.getElementById("url");
      const hasil = document.getElementById("hasil");

      try {
        const alamat = new URL(input.value.trim());

        if (alamat.protocol !== "https:" &&
            alamat.protocol !== "http:") {
          throw new Error();
        }

        hasil.textContent =
          "URL valid: " + alamat.href;
      } catch {
        hasil.textContent =
          "Masukkan URL yang benar, diawali https://";
      }
    }
  </script>
</body>
</html>
